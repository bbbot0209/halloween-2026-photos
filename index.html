#v{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column}
#v.on{display:flex}
#v .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#v img{max-width:100%;max-height:100%;object-fit:contain}
#v .top,#v .bot{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#v .top{justify-content:space-between;color:var(--mut);font-size:14px}
#v .bot{justify-content:center;flex-wrap:wrap}
#v .x{background:none;border:0;color:var(--fg);font-size:30px;line-height:1;cursor:pointer;padding:4px 8px}
.nav{position:absolute;top:0;bottom:0;width:22%;background:none;border:0;color:rgba(255,255,255,.6);font-size:40px;cursor:pointer}
.nav.p{left:0;text-align:left;padding-left:10px}.nav.n{right:0;text-align:right;padding-right:10px}
.tags{color:var(--mut);font-size:13px;text-align:center;width:100%}
footer{color:var(--mut);font-size:12px;text-align:center;padding:0 16px 40px}
</style>

const C=D.costumes,P=D.photos;let cur=-1,list=P,idx=0;
const $=id=>document.getElementById(id);
function gb(mb){return mb>=1000?(mb/1000).toFixed(1)+' GB':Math.round(mb)+' MB'}
function zipLinks(z,label){if(!z||!z.length)return'';return z.map((p,i)=>`<a class="btn${label?' ghost':''}" href="${p.url}" download>${label||'Download all'} (${p.count} photos, ${gb(p.mb)})${z.length>1?` — part ${i+1}/${z.length}`:''}</a>`).join('')}
$('dlall').innerHTML=zipLinks(D.all);
function chips(){let h=`<button class="chip${cur<0?' on':''}" data-i="-1">All<b>${P.length}</b></button>`;
 C.forEach((c,i)=>h+=`<button class="chip${cur==i?' on':''}" data-i="${i}">${c.name}<b>${c.count}</b></button>`);$('chips').innerHTML=h}
function render(){list=cur<0?P:P.filter(p=>p.t.includes(cur));let h='',last=-2;
 list.forEach((p,i)=>{if(cur<0&&p.t[0]!==last){last=p.t[0];h+=`<div class="sec">${C[last].name}</div>`}
  h+=`<a href="#${p.n}" data-k="${i}"><img loading="lazy" decoding="async" src="thumbs/${p.n}.jpg" alt=""></a>`});
 $('grid').innerHTML=h;$('dlc').innerHTML=cur>=0?zipLinks(C[cur].zip,'Download '+C[cur].name):'';chips()}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cur=+b.dataset.i;render();window.scrollTo({top:$('chips').offsetTop-0})};
$('grid').onclick=e=>{const a=e.target.closest('a[data-k]');if(!a)return;e.preventDefault();show(+a.dataset.k)};
function show(i){idx=(i+list.length)%list.length;const p=list[idx];$('vi').src='web/'+p.n+'.jpg';
 $('vc').textContent=`${idx+1} / ${list.length}`;$('vt').textContent=p.t.map(t=>C[t].name).join(' · ');
 const d=$('vd');d.href=p.o;d.setAttribute('download',p.n+'.jpg');d.textContent=`Download original (${p.ow}×${p.oh}, ${p.mb} MB)`;
 $('v').classList.add('on');document.body.style.overflow='hidden';new Image().src='web/'+list[(idx+1)%list.length].n+'.jpg'}
function hide(){$('v').classList.remove('on');document.body.style.overflow='';$('vi').removeAttribute('src')}
$('vx').onclick=hide;$('vp').onclick=()=>show(idx-1);$('vn').onclick=()=>show(idx+1);
document.onkeydown=e=>{if(!$('v').classList.contains('on'))return;if(e.key=='Escape')hide();if(e.key=='ArrowLeft')show(idx-1);if(e.key=='ArrowRight')show(idx+1)};

$('v').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(idx+(dx<0?1:-1));sx=null});
